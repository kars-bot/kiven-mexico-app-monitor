name: 每日应用监控与发布
on:
  push:
    branches: [main]
    paths: [seed.zip, '.github/workflows/monitor.yml']
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: '立即采集新数据（不勾选则仅发布已有数据）'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: app-monitor-pages
  cancel-in-progress: false
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 读取仓库
        uses: actions/checkout@v6
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 恢复网页与历史
        run: |
          unzip -q seed.zip -d work
          if [ -d history ]; then
            cp -R history/. work/automation-tools/google-play-scraper/reports/
          fi
      - name: 安装采集依赖
        if: github.event_name == 'schedule' || inputs.collect == true
        working-directory: work/automation-tools/google-play-scraper
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: 采集墨西哥商店数据
        if: github.event_name == 'schedule' || inputs.collect == true
        run: node work/collect.mjs
      - name: 生成中文数据与保留历史
        run: node work/publish.mjs
      - name: 保存采集历史
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if ! git diff --cached --quiet; then
            git commit -m "更新应用监控历史数据"
            git push
          fi
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: work/site
      - name: 发布固定网址
        id: deployment
        uses: actions/deploy-pages@v4
